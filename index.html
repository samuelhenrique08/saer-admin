<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>SAER — Painel Administrativo</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
  <form id="login-form" class="card">
    <img src="img/saer-logo.png" alt="SAER" class="logo">
    <h1>SAER</h1>
    <div class="subtitle">Serviço Aeropolicial</div>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Senha" required>
    <button type="submit" style="width:100%">Entrar</button>
    <p style="margin-top:18px; font-size:.8rem;">
      <a href="transparencia.html" style="color:var(--text-dim); text-decoration:none;">
        Ver Portal da Transparência →
      </a>
    </p>
    <p id="msg" class="hint" style="margin-top:14px"></p>
  </form>

  <script type="module">
    import { supabase } from './js/supabase.js';

    const form = document.getElementById('login-form');
    const msg = document.getElementById('msg');

    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = 'painel.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = 'Entrando...';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { msg.textContent = 'Erro: ' + error.message; return; }
      window.location.href = 'painel.html';
    });
  </script>
</body>

</html>
