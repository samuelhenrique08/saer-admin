<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria — SAER</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Apenas o CSS do site -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="site-body">

    <!-- HEADER PADRÃO -->
    <header>
        <div class="header-container">
            <!-- Logo -->
            <a href="home.html" class="logo">
                <img src="img/saer-logo.png" alt="Logo SAER">
                <span>SAER — RJ</span>
            </a>

            <!-- Menu de Navegação -->
            <nav id="main-nav">
                <ul>
                    <!-- Como tudo está na raiz, os links são diretos -->
                    <li><a href="home.html">Home</a></li>
                    <li><a href="helicopteros.html">Helicópteros</a></li>
                    <li><a href="galeria.html" class="active">Galeria</a></li>
                    <li><a href="utilidades.html">Utilidades</a></li>
                    <li><a href="memorial.html">Memorial</a></li>
                    <li><a href="transparencia.html">Transparência</a></li>
                </ul>
                <!-- Botão Área Restrita -->
                <div class="nav-actions">
                    <a href="index.html" class="btn-login">
                        <i class="fas fa-lock"></i> Área Restrita
                    </a>
                </div>
            </nav>

            <!-- Botão Hamburger -->
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- CONTEÚDO DA GALERIA -->
    <main class="page-container">

        <div class="page-header">
            <h1 class="page-title">Galeria de Operações</h1>
            <p class="page-subtitle">Registros visuais das aeronaves, treinamentos e ações do SAER.</p>
        </div>

        <div class="gallery-grid">
            <!-- FOTO 1 -->
            <div class="gallery-item" onclick="abrirLightbox(this)">
                <img src="https://i.imgur.com/JYMERS9.png"
                    alt="Logo SAER">
                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>
            </div>

            <!-- FOTO 2 -->
            <div class="gallery-item" onclick="abrirLightbox(this)">
                <img src="https://i.imgur.com/QiDxAuN.png"
                    alt="Comandos">
                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>
            </div>

            <!-- FOTO 3 -->
            <div class="gallery-item" onclick="abrirLightbox(this)">
                <img src="https://i.imgur.com/LXYaLKg.png"
                    alt="Formacao">
                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>
            </div>

            <!-- FOTO 4 -->
            <div class="gallery-item" onclick="abrirLightbox(this)">
                <img src="https://i.imgur.com/NqF2NLX.png"
                    alt="Formacao">
                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>
            </div>

            <!-- FOTO 5 -->
            <div class="gallery-item" onclick="abrirLightbox(this)">
                <img src="https://i.imgur.com/JW29Vq9.png"
                    alt="Halloween">
                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>
            </div>

            <!-- FOTO 6 -->
            <div class="gallery-item" onclick="abrirLightbox(this)">
                <img src="https://i.imgur.com/XMGHpqU.png"
                    alt="Voo diário">
                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>
            </div>
        </div>

    </main>

    <!-- LIGHTBOX (Tela cheia da imagem) -->
    <div id="lightbox" class="lightbox" onclick="fecharLightbox()">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>&copy; 2026 SAER — Serviço Aeropolicial | Polícia Civil RJ / CORE</p>
    </footer>

    <!-- SCRIPTS -->
    <script>
        // Menu Mobile
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.querySelector('nav');
        if (menuToggle && navMenu) {
            menuToggle.addEventListener('click', () => {
                navMenu.classList.toggle('open');
                const icon = menuToggle.querySelector('i');
                if (navMenu.classList.contains('open')) {
                    icon.classList.replace('fa-bars', 'fa-xmark');
                } else {
                    icon.classList.replace('fa-xmark', 'fa-bars');
                }
            });
        }

        // Lógica do Lightbox (Ampliar Imagem)
        function abrirLightbox(element) {
            const imgSrc = element.querySelector('img').src;
            document.getElementById('lightbox-img').src = imgSrc;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function fecharLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>

</html>
